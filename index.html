<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f5c842" />
  <meta name="description" content="Calculate fuel cost and requirements for your trips instantly." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fuel Calc" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Fuel Trip Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#f5c842;--bg:#0d0d12;--bg2:#111820;--bg3:#0a1a10;--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);--border-gold:rgba(245,200,66,0.25);--text:#f0ead6;--muted:#888;--danger:#ff6b6b}
    body{background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 60%,var(--bg3) 100%);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:28px 16px 48px}
    .header{text-align:center;margin-bottom:28px}
    .header-icon{display:inline-flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:50%;font-size:28px;background:linear-gradient(135deg,#f5c842,#e8a020);box-shadow:0 0 36px rgba(245,200,66,0.35);margin-bottom:12px}
    h1{font-family:'DM Serif Display',serif;font-size:26px;letter-spacing:0.02em;background:linear-gradient(90deg,#f5c842,#fff8e0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .subtitle{color:var(--muted);font-size:13px;margin-top:4px}
    .card{background:var(--card);border:1px solid var(--border-gold);border-radius:16px;padding:20px;margin-bottom:16px}
    .card-plain{border-color:var(--border)}
    .card-label{font-size:11px;color:var(--gold);letter-spacing:0.1em;text-transform:uppercase;font-weight:700;margin-bottom:14px}
    .settings-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:5px}
    input[type="number"],input[type="text"]{background:rgba(255,255,255,0.07);border:1px solid var(--border-gold);border-radius:8px;color:var(--gold);padding:9px 10px;font-size:15px;font-weight:700;width:100%;outline:none;font-family:'DM Sans',sans-serif;-webkit-appearance:none}
    input[type="text"]{color:var(--text);font-weight:400;font-size:14px}
    input::placeholder{color:rgba(255,255,255,0.2);font-weight:400}
    input:focus{border-color:var(--gold)}
    .toggle-row{display:flex;align-items:center;gap:10px;margin-top:16px;cursor:pointer;user-select:none}
    .toggle-track{width:42px;height:24px;border-radius:12px;background:rgba(255,255,255,0.1);position:relative;transition:background 0.25s;flex-shrink:0}
    .toggle-track.on{background:rgba(245,200,66,0.8)}
    .toggle-thumb{position:absolute;top:4px;left:4px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left 0.25s;box-shadow:0 1px 4px rgba(0,0,0,0.4)}
    .toggle-track.on .toggle-thumb{left:22px}
    .toggle-label{font-size:13px;color:var(--muted);transition:color 0.2s}
    .toggle-label.on{color:var(--gold)}
    .trip-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,0.04);border:1px solid rgba(255,200,80,0.12);border-radius:12px;padding:12px 14px;margin-bottom:10px}
    .remove-btn{background:rgba(255,80,80,0.12);border:1px solid rgba(255,80,80,0.2);border-radius:8px;color:var(--danger);cursor:pointer;padding:8px 12px;font-size:16px;margin-top:18px;line-height:1}
    .add-trip-btn{width:100%;background:transparent;border:1.5px dashed rgba(245,200,66,0.3);border-radius:12px;color:var(--gold);padding:13px;font-size:14px;cursor:pointer;letter-spacing:0.04em;font-family:'DM Sans',sans-serif}
    .result-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:14px}
    .result-name{color:#ddd}.result-km{color:#555;font-size:12px;margin-left:8px}
    .result-fuel{color:var(--muted);font-size:12px;margin-right:12px}.result-cost{color:var(--gold);font-weight:700}
    .totals{margin-top:14px;padding-top:12px;border-top:1.5px solid rgba(245,200,66,0.25)}
    .total-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
    .total-row.big{font-size:18px;font-weight:700}.total-row.big span{color:var(--gold)}
    .bar-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
    .bar-track{height:10px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden}
    .bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#f5c842,#e8a020);transition:width 0.4s ease}
    .bar-fill.danger{background:linear-gradient(90deg,#ff6b6b,#ff4444)}
    .tank-info{font-size:13px;color:#ccc;line-height:2;margin-top:14px}
    .tank-info strong{color:var(--gold)}.tank-info .warn{color:var(--danger)}
    .footnote{text-align:center;font-size:11px;color:#333;margin-top:20px}
    .wrap{max-width:600px;margin:0 auto}
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-icon">&#9981;</div>
    <h1>Fuel Trip Calculator</h1>
    <p class="subtitle">Plan your trips. Save on fuel.</p>
  </div>
  <div class="card">
    <div class="card-label">&#9881; Vehicle Settings</div>
    <div class="settings-grid">
      <div class="field"><label>Fuel Price (&#8377;/L)</label><input type="number" id="fuelPrice" value="108" min="0" oninput="calculate()" /></div>
      <div class="field"><label>Mileage (km/L)</label><input type="number" id="mileage" value="14" min="1" oninput="calculate()" /></div>
      <div class="field"><label>Tank Cap. (L)</label><input type="number" id="tankCap" value="60" min="1" oninput="calculate()" /></div>
    </div>
    <div class="toggle-row" onclick="toggleRoundTrip()">
      <div class="toggle-track" id="toggleTrack"><div class="toggle-thumb"></div></div>
      <span class="toggle-label" id="toggleLabel">All trips are <strong>To &amp; Fro</strong> (doubles distance)</span>
    </div>
  </div>
  <div class="card card-plain">
    <div class="card-label">&#128506; Your Trips</div>
    <div id="tripList"></div>
    <button class="add-trip-btn" onclick="addTrip()">+ Add Another Trip</button>
  </div>
  <div class="card" id="resultsCard" style="display:none">
    <div class="card-label">&#128202; Breakdown</div>
    <div id="tripResults"></div>
    <div class="totals" id="totalsSection"></div>
  </div>
  <div class="card card-plain" id="tankCard" style="display:none">
    <div class="card-label">&#128706; Tank Planning</div>
    <div class="bar-meta"><span>Fuel needed vs full tank</span><span id="barPct">0%</span></div>
    <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    <div class="tank-info" id="tankInfo"></div>
  </div>
  <p class="footnote">Estimates based on avg mileage. Actual usage may vary with traffic &amp; AC use.</p>
</div>
<script>
let trips=[{label:'',distance:''}],roundTrip=false;
function toggleRoundTrip(){roundTrip=!roundTrip;document.getElementById('toggleTrack').classList.toggle('on',roundTrip);document.getElementById('toggleLabel').classList.toggle('on',roundTrip);calculate()}
function addTrip(){trips.push({label:'',distance:''});renderTrips();calculate()}
function removeTrip(i){if(trips.length===1)return;trips.splice(i,1);renderTrips();calculate()}
function updateTrip(i,f,v){trips[i][f]=v;calculate()}
function renderTrips(){document.getElementById('tripList').innerHTML=trips.map((t,i)=>`<div class="trip-row"><div class="field"><label>Trip Label</label><input type="text" placeholder="Trip ${i+1}" value="${t.label}" oninput="updateTrip(${i},'label',this.value)"/></div><div class="field"><label>Distance (km)</label><input type="number" placeholder="e.g. 120" value="${t.distance}" min="0" oninput="updateTrip(${i},'distance',this.value)"/></div><button class="remove-btn" onclick="removeTrip(${i})">&#x2715;</button></div>`).join('')}
function fmt(n){return Math.ceil(n).toLocaleString('en-IN')}
function calculate(){
  const price=parseFloat(document.getElementById('fuelPrice').value)||0;
  const mpg=parseFloat(document.getElementById('mileage').value)||1;
  const tank=parseFloat(document.getElementById('tankCap').value)||60;
  const results=trips.map((t,i)=>{const d=parseFloat(t.distance)||0;const dist=roundTrip?d*2:d;const fuel=dist/mpg;return{label:t.label||'Trip '+(i+1),dist,fuel,cost:fuel*price}});
  const tDist=results.reduce((s,r)=>s+r.dist,0);
  const tFuel=results.reduce((s,r)=>s+r.fuel,0);
  const tCost=results.reduce((s,r)=>s+r.cost,0);
  if(tDist===0){document.getElementById('resultsCard').style.display='none';document.getElementById('tankCard').style.display='none';return}
  document.getElementById('resultsCard').style.display='';
  document.getElementById('tankCard').style.display='';
  document.getElementById('tripResults').innerHTML=results.filter(r=>r.dist>0).map(r=>`<div class="result-row"><div><span class="result-name">${r.label}</span><span class="result-km">${r.dist} km</span></div><div><span class="result-fuel">${r.fuel.toFixed(2)} L</span><span class="result-cost">&#8377;${fmt(r.cost)}</span></div></div>`).join('');
  document.getElementById('totalsSection').innerHTML=`<div class="total-row"><span style="color:#bbb">Total Distance</span><span style="color:#ddd">${tDist.toFixed(0)} km</span></div><div class="total-row"><span style="color:#bbb">Total Fuel Required</span><span style="color:#ddd">${tFuel.toFixed(2)} L</span></div><div class="total-row big"><span>Total Estimated Cost</span><span>&#8377;${fmt(tCost)}</span></div>`;
  const pct=Math.min(100,tFuel/tank*100);
  document.getElementById('barPct').textContent=pct.toFixed(0)+'%';
  const fill=document.getElementById('barFill');
  fill.style.width=pct+'%';fill.className='bar-fill'+(tFuel>tank?' danger':'');
  document.getElementById('tankInfo').innerHTML=tFuel<=tank?`&#9989; A <strong>full tank costs &#8377;${fmt(tank*price)}</strong> and covers all trips.<br>&#129518; You will use <strong>${tFuel.toFixed(2)} L</strong>, leaving ~<strong>${(tank-tFuel).toFixed(1)} L</strong> spare.`:`&#9888; Trips need <span class="warn">${tFuel.toFixed(2)} L</span> - more than one full tank (${tank}L).<br>&#128260; Plan to refuel <strong>at least ${Math.ceil(tFuel/tank)} times</strong>.`
}
renderTrips();calculate();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
